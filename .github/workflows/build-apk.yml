name: Build ChatNote APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d src_project
          DIR=$(dirname "$(find src_project -name settings.gradle.kts | head -n1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept SDK licenses and install platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle :app:assembleDebug --no-daemon
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ChatNote.apk
          gh release create "build-${{ github.run_number }}" ChatNote.apk --title "ChatNote build ${{ github.run_number }}" --notes "Debug APK"
