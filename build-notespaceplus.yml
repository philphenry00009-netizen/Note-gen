name: Build note Space Plus APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q GameSpacePlus.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: GameSpacePlus
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GameSpacePlus-apk
          path: GameSpacePlus/app/build/outputs/apk/release/*.apk
